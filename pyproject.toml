[project]
name = "host-your-own-llm"
version = "0.1.0"
description = "Serve an LLM with vLLM in Docker, with model weights in a local S3 bucket"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "huggingface-hub>=1.33",
    "pydantic>=2",
    "rich>=15",
    "typer>=0.27.3",
]

[project.scripts]
llm = "host_your_own_llm.cli:main"

[dependency-groups]
dev = [
    "boto3>=1.43",
    "pre-commit>=4.7.0",
    "pyrefly>=1.3.2",
    "pytest>=8",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "functional: real CLI, model store and Hugging Face in an isolated project; needs Docker, no GPU",
    "gpu: serves models on the GPU in an isolated project; opt in with `-m gpu`",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["host_your_own_llm"]
# The tests import these by module name from their own folders
known-local-folder = ["fakes", "conftest"]

[tool.pyrefly]
project-includes = ["src", "tests", "image"]
search-path = ["src", "tests", "tests/unit"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
