[project]
name = "host-your-own-llm"
version = "0.1.0"
description = "Self-host any Hugging Face LLM on your own NVIDIA GPU behind an OpenAI-compatible API. One CLI, vLLM in Docker, models cached in a local S3 store."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "James Andrews", email = "james.andrews.dev@gmail.com" }]
requires-python = ">=3.12"
keywords = [
    "llm", "vllm", "self-hosted", "local-llm", "openai-compatible", "llm-serving",
    "huggingface", "docker", "gpu", "nvidia", "s3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx2>=2.13.1",
    "huggingface-hub>=1.33",
    "pydantic>=2",
    "rich>=15",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/Jimdrews/host-your-own-llm"
Repository = "https://github.com/Jimdrews/host-your-own-llm"
Issues = "https://github.com/Jimdrews/host-your-own-llm/issues"

[project.scripts]
llm = "host_your_own_llm.cli:main"

[dependency-groups]
dev = [
    "boto3>=1.43",
    "pre-commit>=4.7.0",
    "pyrefly>=1.3.2",
    "pytest>=8",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "functional: real CLI, model store and Hugging Face in an isolated project; needs Docker, no GPU",
    "gpu: serves models on the GPU in an isolated project; opt in with `-m gpu`",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["host_your_own_llm"]
# The tests import these by module name from their own folders
known-local-folder = ["fakes", "conftest"]

[tool.pyrefly]
project-includes = ["src", "tests", "image"]
search-path = ["src", "tests", "tests/unit"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
